stages:
  - deps
  - test
  - build
  - release

workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == "master"

image: electronuserland/builder:latest

cache:
  key:
    files:
      - yarn.lock
  paths:
  - node_modules/

yarn_install:
  stage: deps
  script: yarn

test_lint:
  stage: test
  cache:
    policy: pull
  script: yarn lint

test_jest:
  stage: test
  cache:
    policy: pull
  script: yarn test

build_dist:
  stage: build
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: on_success
  cache:
    policy: pull
  script: yarn dist
  artifacts:
    paths:
      - dist/*.snap

release_publish:
  stage: release
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: manual
  cache:
    policy: pull
  script:
    - ls -l dist/*.snap
    - apt-get update -qy
    - apt-get install -y snapcraft
    - echo $SNAPCRAFT_LOGIN_FILE | base64 --decode --ignore-garbage > snapcraft.login
    - snapcraft login --with snapcraft.login
    - snapcraft push dist/*.snap --release=stable
