stages:
  - deps
  - test
  - build_version
  - build
  - release_version
  - release

workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == "master"

default:
  cache:
    key:
      files:
        - yarn.lock
    paths:
    - node_modules/
    policy: pull

image: electronuserland/builder:latest

yarn_install:
  extends: default
  stage: deps
  cache:
    policy: pull-push
  script: yarn

test_lint:
  stage: test
  script: yarn lint

test_jest:
  stage: test
  script: yarn test

build_version:
  stage: build_version
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: on_success
  script: yarn exec standard-version
  artifacts:
    paths:
      - package.json

build:linux:
  stage: build
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: on_success
  script: yarn dist
  artifacts:
    paths:
      - dist/*.snap

build:mac:
  stage: build
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: on_success
  tags:
    - macos
  script:
    - yarn # as cached packages will have been from Linux runner
    - yarn dist
  artifacts:
    paths:
      - dist/*.zip
      - dist/*.dmg

release_version:
  stage: release_version
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: manual
  script:
    - git checkout -- package.json
    - yarn exec standard-version
    - git push
  artifacts:
    paths:
      - package.json

release:snapstore:
  stage: release
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: manual
  script:
    - echo "release to snapstore placeholder"
    # - bin/release-snapstore.sh

release:github:
  stage: release
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: manual
  script:
    - echo "release go github placeholder"
    # - bin/release-github.sh
