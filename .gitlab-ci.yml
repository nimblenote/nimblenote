stages:
  - deps
  - test
  - build
  - release

workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == "master"

default:
  cache:
    key:
      files:
        - yarn.lock
    paths:
    - node_modules/
    policy: pull

image: electronuserland/builder:latest

yarn_install:
  extends: default
  stage: deps
  cache:
    policy: pull-push
  script: yarn

test_lint:
  stage: test
  script: yarn lint

test_jest:
  stage: test
  script: yarn test

build:linux:
  stage: build
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: on_success
  script: yarn dist
  artifacts:
    paths:
      - dist/*.snap

build:mac:
  stage: build
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: on_success
  tags:
    - macos
  script:
    - yarn # as cached packages will have been from Linux runner
    - yarn dist
  artifacts:
    paths:
      - dist/*.zip
      - dist/*.dmg

release:linux:
  stage: release
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: manual
  dependencies:
    - build:linux
  script:
    - ls -l dist/*.snap
    - apt-get update -qy
    - apt-get install -y snapcraft
    - echo $SNAPCRAFT_LOGIN_FILE | base64 --decode --ignore-garbage > snapcraft.login
    - snapcraft login --with snapcraft.login
    - snapcraft push dist/*.snap --release=stable

release:mac:
  stage: release
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: manual
  dependencies:
    - build:mac
  script:
    - ls -l dist/*.zip
    - ls -l dist/*.dmg
    - snap install jq
    - curl 'https://github.com/github-release/github-release/releases/download/v0.8.1/linux-amd64-github-release.bz2' -L -o github-release.bz2
    - bzip2 -d github-release.bz2
    - chmod +x github-release
    - ./github-release --version
    - NOTED_VERSION="v$(cat package.json | jq '.version' --raw-output)"
    - ./github-release release --user davidwinter --repo noted --tag "${NOTED_VERSION}" --name "${NOTED_VERSION}" --description "${NOTED_VERSION}" --draft
    - ./github-release upload --user davidwinter --repo noted --tag "${NOTED_VERSION}" --file dist/*.zip --name "Noted-$(cat package.json | jq '.version' --raw-output)-mac.zip"
    - ./github-release upload --user davidwinter --repo noted --tag "${NOTED_VERSION}" --file dist/*.dmg --name "Noted-$(cat package.json | jq '.version' --raw-output)-mac.dmg"
    - ./github-release edit --user davidwinter --repo noted --tag "${NOTED_VERSION}"

