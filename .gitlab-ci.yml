stages:
  - deps
  - test
  - build
  - release

image: electronuserland/builder:latest

cache:
  paths:
  - node_modules/

yarn_install:
  stage: deps
  script: yarn

test_lint:
  stage: test
  script: yarn lint

test_jest:
  stage: test
  script: yarn test

build_dist:
  stage: build
  script: yarn dist
  only:
    - master

release_publish:
  stage: release
  script: yarn release
  when: manual
  only:
    - master
