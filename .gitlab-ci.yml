stages:
  - deps
  - test
  - build
  - release

workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == "master"

default:
  cache:
    key:
      files:
        - yarn.lock
    paths:
    - node_modules/
    policy: pull

image: electronuserland/builder:latest

yarn_install:
  extends: default
  stage: deps
  cache:
    policy: pull-push
  script: yarn

test_lint:
  stage: test
  script: yarn lint

test_jest:
  stage: test
  script: yarn test

build:linux:
  stage: build
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: on_success
  script: yarn dist
  artifacts:
    paths:
      - dist/*.snap

build:mac:
  stage: build
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: on_success
  tags:
    - macos
  script: yarn dist
  artifacts:
    paths:
      - dist/*.zip
      - dist/*.dmg

release:linux:
  stage: release
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: manual
  script:
    - ls -l dist/*.snap
    - apt-get update -qy
    - apt-get install -y snapcraft
    - echo $SNAPCRAFT_LOGIN_FILE | base64 --decode --ignore-garbage > snapcraft.login
    - snapcraft login --with snapcraft.login
    - snapcraft push dist/*.snap --release=stable
