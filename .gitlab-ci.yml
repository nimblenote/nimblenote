stages:
  - deps
  - test
  - build
  - release

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == "master"

default:
  cache:
    key:
      files:
        - yarn.lock
    paths:
    - node_modules/
    policy: pull

image: electronuserland/builder:latest

yarn_install:
  extends: default
  stage: deps
  cache:
    policy: pull-push
  script:
    - yarn

test_lint:
  stage: test
  script:
    - yarn lint

test_jest:
  stage: test
  script:
    - yarn test

build:linux:
  stage: build
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: on_success
  script:
    - yarn build
  artifacts:
    paths:
      - dist/*.snap

build:mac:
  stage: build
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: on_success
  tags:
    - macos
  script:
    - yarn # as cached packages will have been from Linux runner
    - yarn build
  artifacts:
    paths:
      - dist/*.zip
      - dist/*.dmg

release:snapstore:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
  script:
    - echo "release to snapstore placeholder"
    # - bin/release-snapstore.sh

release:github:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
  script:
    - echo "release go github placeholder"
    # - bin/release-github.sh
