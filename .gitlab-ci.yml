stages:
  - deps
  - test
  - build
  - release

image: electronuserland/builder:latest

cache:
  paths:
  - node_modules/

yarn_install:
  stage: deps
  script: yarn

test_lint:
  stage: test
  script: yarn lint

test_jest:
  stage: test
  script: yarn test

build_dist:
  stage: build
  script: yarn dist
  only:
    - master

release_publish:
  stage: release
  script:
    - yarn dist
    - apt-get update -qy
    - apt-get install -y snapcraft
    - snapcraft
    - echo $SNAPCRAFT_LOGIN_FILE | base64 --decode --ignore-garbage > snapcraft.login
    - snapcraft login --with snapcraft.login
    - snapcraft push dist/*.snap --release=stable
  when: manual
  only:
    - master
